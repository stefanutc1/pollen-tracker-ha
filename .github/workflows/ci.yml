name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-code:
    name: Validate Python Code & Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pytest
          if [ -f custom_components/pollen_tracker/requirements.txt ]; then
            pip install -r custom_components/pollen_tracker/requirements.txt
          fi

      - name: Check Code Formatting (Black)
        run: |
          black --check custom_components/pollen_tracker/

      - name: Lint with Flake8
        run: |
          flake8 custom_components/pollen_tracker/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 custom_components/pollen_tracker/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Unit Tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/
          else
            echo "No tests directory found, skipping."
          fi

  hacs-validation:
    name: HACS Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: HACS Action
        uses: hacs/action@2.4.1
        with:
          category: integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
